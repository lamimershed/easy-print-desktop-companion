<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  .icon {
    width: 1024px;
    height: 1024px;
    background: linear-gradient(145deg, #1a4d30, #2d7a4f);
    border-radius: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div class="icon">
  <svg width="680" height="620" viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- paper feed (top) -->
    <rect x="22" y="2" width="36" height="20" rx="3" fill="white" fill-opacity="0.92"/>
    <rect x="28" y="7" width="24" height="2" rx="1" fill="#2d7a4f"/>
    <rect x="28" y="12" width="16" height="2" rx="1" fill="#2d7a4f" fill-opacity="0.4"/>
    <!-- printer body -->
    <rect x="6" y="18" width="68" height="30" rx="7" fill="white" fill-opacity="0.22"/>
    <rect x="6" y="18" width="68" height="30" rx="7" stroke="white" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- top slot -->
    <rect x="20" y="20" width="40" height="3" rx="1.5" fill="white" fill-opacity="0.3"/>
    <!-- status LED -->
    <circle cx="56" cy="33" r="3" fill="#3aad6a"/>
    <circle cx="56" cy="33" r="1.6" fill="#7deeaa"/>
    <circle cx="65" cy="33" r="2" fill="white" fill-opacity="0.3"/>
    <!-- output paper -->
    <rect x="18" y="42" width="44" height="26" rx="3" fill="white"/>
    <rect x="26" y="49" width="28" height="2.5" rx="1.2" fill="#2d7a4f"/>
    <rect x="26" y="55" width="20" height="2.5" rx="1.2" fill="#2d7a4f" fill-opacity="0.4"/>
    <rect x="26" y="61" width="14" height="2.5" rx="1.2" fill="#2d7a4f" fill-opacity="0.22"/>
  </svg>
</div>
</body>
</html>
