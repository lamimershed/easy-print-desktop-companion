<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Print App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
        text-align: center;
      }
      .print-btn {
        width: 100%;
        padding: 16px 32px;
        font-size: 18px;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .print-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }
      .print-btn:active {
        transform: translateY(0);
      }
      .printers-section {
        margin-top: 30px;
      }
      .printers-section h2 {
        color: #555;
        font-size: 16px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .refresh-btn {
        background: #eee;
        border: none;
        padding: 4px 10px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .refresh-btn:hover {
        background: #ddd;
      }
      .printer-list {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        max-height: 200px;
        overflow-y: auto;
      }
      .printer-item {
        padding: 10px;
        background: white;
        border-radius: 6px;
        margin-bottom: 8px;
        border-left: 4px solid #667eea;
      }
      .printer-item:last-child {
        margin-bottom: 0;
      }
      .printer-name {
        font-weight: 600;
        color: #333;
      }
      .printer-status {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }
      .no-printers {
        color: #888;
        text-align: center;
        padding: 20px;
      }
      .default-badge {
        background: #28a745;
        color: white;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🖨️ Cafe Print App</h1>

      <button class="print-btn" id="printBtn">Print "Hello World"</button>

      <div class="printers-section">
        <h2>
          Connected Printers
          <button class="refresh-btn" id="refreshBtn">Refresh</button>
        </h2>
        <div class="printer-list" id="printerList">
          <div class="no-printers">Loading printers...</div>
        </div>
      </div>
    </div>

    <script>
      const printBtn = document.getElementById("printBtn");
      const refreshBtn = document.getElementById("refreshBtn");
      const printerList = document.getElementById("printerList");

      async function loadPrinters() {
        printerList.innerHTML =
          '<div class="no-printers">Loading printers...</div>';

        try {
          const printers = await window.electronAPI.getPrinters();

          if (printers.length === 0) {
            printerList.innerHTML =
              '<div class="no-printers">No printers found</div>';
            return;
          }

          printerList.innerHTML = printers
            .map(
              (printer) => `
          <div class="printer-item">
            <div class="printer-name">
              ${printer.name}
              ${printer.isDefault ? '<span class="default-badge">Default</span>' : ""}
            </div>
            <div class="printer-status">
              Status: ${printer.status === 0 ? "Ready" : "Busy/Offline"}
            </div>
          </div>
        `,
            )
            .join("");
        } catch (error) {
          printerList.innerHTML =
            '<div class="no-printers">Error loading printers</div>';
          console.error(error);
        }
      }

      printBtn.addEventListener("click", async () => {
        printBtn.textContent = "Printing...";
        printBtn.disabled = true;

        try {
          await window.electronAPI.printHello();
        } catch (error) {
          console.error("Print error:", error);
        }

        printBtn.textContent = 'Print "Hello World"';
        printBtn.disabled = false;
      });

      refreshBtn.addEventListener("click", loadPrinters);

      // Load printers on startup
      loadPrinters();
    </script>
  </body>
</html>
